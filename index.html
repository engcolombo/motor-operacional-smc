<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Motor Operacional SMC</title>

<link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet"/>

<style>
body {
    background: linear-gradient(135deg, #0b2c6b, #1e4ed8);
    min-height: 100vh;
    padding:30px;
}

.card {
    border-radius:18px;
    box-shadow:0 20px 40px rgba(0,0,0,0.25);
    padding:20px;
}

.form-select, .btn {
    border-radius:14px !important;
}

.resultado {
    margin-top:10px;
    padding:15px;
    border-radius:14px;
    font-weight:bold;
    text-align:center;
}

.excelente { background:#dbeafe; color:#1e3a8a; }
.bom { background:#dcfce7; color:#166534; }
.medio { background:#fef9c3; color:#854d0e; }
.fraco { background:#fee2e2; color:#991b1b; }

.gatilhos-box {
    background:#f1f5f9;
    padding:12px;
    border-radius:14px;
    margin-top:10px;
    font-size:13px;
}

.hidden { display:none; }

.dashboard-card{
    border-radius:18px;
    padding:20px;
    color:white;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,0.3);
}

.modal-bg{
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-box{
    background:white;
    padding:25px;
    border-radius:18px;
    width:350px;
}
</style>
</head>

<body>

<div class="container-xl">

<div class="d-flex justify-content-between mb-4">
<h2 class="text-white">Motor Operacional SMC</h2>
<div>
<button class="btn btn-light" onclick="mostrarOperacional()">Operacional</button>
<button class="btn btn-warning" onclick="mostrarDashboard()">Dashboard</button>
</div>
</div>

<!-- ================= OPERACIONAL ================= -->
<div id="paginaOperacional">

<div class="row g-4">

<!-- ================= TRAP ================= -->
<div class="col-md-4">
<div class="card">
<h4>TRAP máxima e mínima</h4>

<select id="gatilhoA" class="form-select mb-2">
<option></option>
<option>Trap na Máxima - VENDA</option>
<option>Trap na Mínima - COMPRA</option>
</select>

<select id="macroA" class="form-select mb-2">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<select id="microA" class="form-select mb-2">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<select id="mm80A" class="form-select mb-2">
<option></option><option>Subindo</option><option>Caindo</option>
</select>

<select id="vwapA" class="form-select mb-2">
<option></option><option>Distante</option><option>Proximo</option><option>Toque</option>
</select>

<select id="estocA" class="form-select mb-2">
<option></option><option>Divergente</option><option>Nao divergente</option>
</select>

<select id="obpA" class="form-select mb-2">
<option></option><option>Sim</option><option>Nao</option>
</select>

<select id="obsA" class="form-select mb-2">
<option></option><option>Sim</option><option>Nao</option>
</select>

<button class="btn btn-primary w-100" onclick="avaliar('A')">Avaliar</button>

<div id="resultadoA" class="resultado"></div>
<div id="gatilhosPermitidosA" class="gatilhos-box"></div>
<button id="btnRegistrarA" class="btn btn-outline-primary w-100 mt-2 hidden" onclick="abrirModal('A')">Registrar Trade</button>

</div>
</div>

<!-- ================= SMC ================= -->
<div class="col-md-4">
<div class="card">
<h4>SMC</h4>

<select id="gatilhoB" class="form-select mb-2">
<option></option>
<option>Captura de liquidez em range</option>
<option>Captura de liquidez de BOS relevante</option>
</select>

<select id="macroB" class="form-select mb-2">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<select id="microB" class="form-select mb-2">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<select id="mm80B" class="form-select mb-2">
<option></option><option>Sim</option><option>Não</option>
</select>

<select id="vwapB" class="form-select mb-2">
<option></option><option>Distante</option><option>Proximo</option><option>Toque</option>
</select>

<select id="estocB" class="form-select mb-2">
<option></option><option>Sim</option><option>Não</option>
</select>

<select id="fvgB" class="form-select mb-2">
<option></option><option>Sim</option><option>Não</option>
</select>

<select id="obpB" class="form-select mb-2">
<option></option><option>Sim</option><option>Nao</option>
</select>

<select id="obsB" class="form-select mb-2">
<option></option><option>Sim</option><option>Nao</option>
</select>

<button class="btn btn-primary w-100" onclick="avaliar('B')">Avaliar</button>

<div id="resultadoB" class="resultado"></div>
<div id="gatilhosPermitidosB" class="gatilhos-box"></div>
<button id="btnRegistrarB" class="btn btn-outline-primary w-100 mt-2 hidden" onclick="abrirModal('B')">Registrar Trade</button>

</div>
</div>

<!-- ================= OB / VWAP / POC ================= -->
<div class="col-md-4">
<div class="card">
<h4>OB / VWAP / POC</h4>

<select id="gatilhoC" class="form-select mb-2">
<option></option>
<option>OB HTF</option>
<option>OB interno</option>
<option>VWAP</option>
<option>Volume Profile POC</option>
</select>

<select id="macroC" class="form-select mb-2">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<select id="microC" class="form-select mb-2">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<select id="mm80C" class="form-select mb-2">
<option></option><option>Sim</option><option>Não</option>
</select>

<select id="vwapC" class="form-select mb-2">
<option></option><option>Distante</option><option>Proximo</option><option>Toque</option>
</select>

<select id="estocC" class="form-select mb-2">
<option></option><option>Sim</option><option>Não</option>
</select>

<select id="fvgC" class="form-select mb-2">
<option></option><option>Sim</option><option>Não</option>
</select>

<select id="obpC" class="form-select mb-2">
<option></option><option>Sim</option><option>Nao</option>
</select>

<select id="obsC" class="form-select mb-2">
<option></option><option>Sim</option><option>Nao</option>
</select>

<button class="btn btn-primary w-100" onclick="avaliar('C')">Avaliar</button>

<div id="resultadoC" class="resultado"></div>
<div id="gatilhosPermitidosC" class="gatilhos-box"></div>
<button id="btnRegistrarC" class="btn btn-outline-primary w-100 mt-2 hidden" onclick="abrirModal('C')">Registrar Trade</button>

</div>
</div>

</div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="paginaDashboard" class="hidden mt-4">

<div class="row g-4">

<div class="col-md-2"><div class="dashboard-card bg-blue"><h6>Total</h6><h2 id="statTotal">0</h2></div></div>
<div class="col-md-2"><div class="dashboard-card bg-green"><h6>Wins</h6><h2 id="statWins">0</h2></div></div>
<div class="col-md-2"><div class="dashboard-card bg-red"><h6>Stops</h6><h2 id="statStops">0</h2></div></div>
<div class="col-md-2"><div class="dashboard-card bg-yellow"><h6>Winrate</h6><h2 id="statWinrate">0%</h2></div></div>
<div class="col-md-2"><div class="dashboard-card bg-indigo"><h6>R Total</h6><h2 id="statRTotal">0</h2></div></div>
<div class="col-md-2"><div class="dashboard-card bg-cyan"><h6>Payoff</h6><h2 id="statPayoff">0R</h2></div></div>

</div>

<div class="mt-4">
<button class="btn btn-light" onclick="exportarCSV()">Exportar CSV</button>
<button class="btn btn-danger" onclick="limparHistorico()">Limpar Histórico</button>
</div>

</div>

</div>

<!-- ================= MODAL ================= -->
<div class="modal-bg" id="modal">
<div class="modal-box">

<label>Alvo</label>
<select id="alvo" class="form-select mb-2">
<option>1:1R</option>
<option>1:2R</option>
<option>1:3R</option>
<option>Stop</option>
</select>

<label>Parcial?</label>
<select id="parcial" class="form-select mb-3">
<option>Sim</option>
<option>Não</option>
</select>

<button class="btn btn-primary w-100" onclick="salvarTrade()">Salvar</button>

</div>
</div>

<script>

/* ===== TRANSIÇÃO ===== */

function mostrarDashboard(){
    document.getElementById("paginaOperacional").classList.add("hidden");
    document.getElementById("paginaDashboard").classList.remove("hidden");
    atualizarEstatisticas();
}

function mostrarOperacional(){
    document.getElementById("paginaDashboard").classList.add("hidden");
    document.getElementById("paginaOperacional").classList.remove("hidden");
}

</body>
</html>
