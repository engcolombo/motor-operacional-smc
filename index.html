<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Motor Operacional SMC</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(135deg, #0a2647 0%, #1e3a6b 50%, #2a4f8e 100%);
    padding: 20px;
    min-height: 100vh;
}

.wrapper {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    max-width: 1600px;
    margin: 0 auto;
    align-items: flex-start;
}

.container {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    padding: 18px 20px;
    width: 380px;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.container:hover {
    transform: translateY(-5px);
    box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4);
}

h3 {
    color: #0a2647;
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 3px solid #3b82f6;
    letter-spacing: 0.5px;
}

label {
    font-weight: 500;
    font-size: 0.7rem;
    margin-top: 6px;
    margin-bottom: 2px;
    display: block;
    color: #334155;
    text-transform: uppercase;
    letter-spacing: 0.3px;
}

select {
    width: 100%;
    padding: 8px 12px;
    margin-bottom: 8px;
    font-size: 0.85rem;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    background-color: white;
    cursor: pointer;
    transition: all 0.2s ease;
    outline: none;
    color: #1e293b;
}

select:hover {
    border-color: #3b82f6;
}

select:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

button {
    width: 100%;
    padding: 10px 16px;
    margin: 6px 0;
    font-size: 0.9rem;
    font-weight: 600;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

button:not(.stats button) {
    background: linear-gradient(135deg, #3b82f6 0%, #1e4b8f 100%);
    color: white;
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
}

button:not(.stats button):hover {
    background: linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%);
    transform: scale(1.02);
    box-shadow: 0 12px 25px rgba(59, 130, 246, 0.4);
}

.resultado {
    margin-top: 10px;
    padding: 12px;
    border-radius: 20px;
    font-weight: 700;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-size: 1rem;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

.excelente {
    background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
    color: #1e40af;
    border: 2px solid #3b82f6;
}

.bom {
    background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
    color: #166534;
    border: 2px solid #22c55e;
}

.medio {
    background: linear-gradient(135deg, #fef9c3 0%, #fde047 100%);
    color: #854d0e;
    border: 2px solid #eab308;
}

.fraco {
    background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
    color: #991b1b;
    border: 2px solid #ef4444;
}

.gatilhos-box {
    background: #f8fafc;
    padding: 12px 15px;
    border-radius: 20px;
    margin-top: 10px;
    font-size: 0.85rem;
    border: 2px solid #e2e8f0;
}

.gatilhos-box strong {
    display: block;
    margin-bottom: 8px;
    color: #0f172a;
    font-size: 0.9rem;
}

.gatilhos-box label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    margin: 3px 0;
    background: white;
    border-radius: 40px;
    border: 2px solid #e2e8f0;
    cursor: pointer;
    transition: all 0.2s ease;
    font-weight: 400;
    text-transform: none;
    font-size: 0.85rem;
}

.gatilhos-box label:hover {
    background: #e2e8f0;
    border-color: #94a3b8;
}

.gatilhos-box input[type="radio"] {
    width: 16px;
    height: 16px;
    accent-color: #3b82f6;
    margin: 0;
}

.stats {
    max-width: 800px;
    margin: 20px auto;
    padding: 18px 20px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    font-size: 0.9rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.stats br {
    display: none;
}

.stats::before {
    content: "📊 Estatísticas";
    grid-column: 1 / -1;
    font-size: 1.2rem;
    font-weight: 700;
    color: #0a2647;
    margin-bottom: 5px;
    padding-bottom: 8px;
    border-bottom: 3px solid #3b82f6;
}

.stats:not(:empty) {
    display: grid;
}

.stats span {
    background: #f1f5f9;
    padding: 8px 12px;
    border-radius: 16px;
    text-align: center;
    font-weight: 500;
    color: #1e293b;
    font-size: 0.85rem;
}

.stats + button {
    width: auto;
    min-width: 180px;
    margin: 8px;
    display: inline-block;
}

.stats + button + button {
    width: auto;
    min-width: 180px;
    margin: 8px;
    display: inline-block;
}

.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 38, 71, 0.8);
    backdrop-filter: blur(5px);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-content {
    background: white;
    padding: 25px 30px;
    width: 320px;
    border-radius: 32px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
    animation: modalSlide 0.3s ease;
}

@keyframes modalSlide {
    from {
        transform: translateY(-30px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.modal-content label {
    font-size: 0.8rem;
    margin-top: 12px;
}

.modal-content select {
    margin-bottom: 12px;
}

.modal-content button {
    margin-top: 15px;
    background: linear-gradient(135deg, #3b82f6 0%, #1e4b8f 100%);
}

.modal-content h3 {
    margin-bottom: 15px;
    border-bottom: none;
    font-size: 1.3rem;
}

#btnRegistrarA, #btnRegistrarB, #btnRegistrarC {
    margin-top: 12px;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
    font-size: 0.85rem;
    padding: 8px 12px;
}

#btnRegistrarA:hover, #btnRegistrarB:hover, #btnRegistrarC:hover {
    background: linear-gradient(135deg, #059669 0%, #047857 100%);
}

/* Botões de ação no final */
body > button {
    width: auto;
    min-width: 180px;
    margin: 8px;
    background: rgba(255, 255, 255, 0.95);
    color: #0a2647;
    border: 2px solid white;
    font-size: 0.85rem;
    padding: 10px 16px;
}

body > button:hover {
    background: white;
    transform: translateY(-2px);
}

/* Responsividade */
@media (max-width: 768px) {
    body {
        padding: 10px;
    }
    
    .container {
        width: 100%;
        max-width: 380px;
        padding: 15px;
    }
    
    .stats {
        grid-template-columns: 1fr 1fr;
        padding: 15px;
    }
    
    body > button {
        width: calc(50% - 16px);
        min-width: auto;
    }
}

/* Ajuste para os selects ficarem mais compactos */
.container > *:last-child {
    margin-bottom: 0;
}

/* Pequeno ajuste para o último select antes do botão */
select:last-of-type {
    margin-bottom: 8px;
}

/* Ajuste da altura total do card para evitar scroll */
.container {
    max-height: fit-content;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- ================= TRAP ================= -->
<div class="container">
<h3>⚡ TRAP máxima e mínima</h3>

<label>Setup</label>
<select id="gatilhoA">
<option></option>
<option>Trap na Máxima - VENDA</option>
<option>Trap na Mínima - COMPRA</option>
</select>

<label>Tendência Macro</label>
<select id="macroA"><option></option><option>Alta</option><option>Baixa</option><option>Lateral</option></select>

<label>Tendência Micro</label>
<select id="microA"><option></option><option>Alta</option><option>Baixa</option><option>Lateral</option></select>

<label>MM80</label>
<select id="mm80A"><option></option><option>Subindo</option><option>Caindo</option></select>

<label>VWAP</label>
<select id="vwapA"><option></option><option>Distante</option><option>Proximo</option><option>Toque</option></select>

<label>Estocástico</label>
<select id="estocA"><option></option><option>Divergente</option><option>Nao divergente</option></select>

<label>OB Primário</label>
<select id="obpA"><option></option><option>Sim</option><option>Nao</option></select>

<label>OB Secundário</label>
<select id="obsA"><option></option><option>Sim</option><option>Nao</option></select>

<button onclick="avaliar('A')">Avaliar Setup</button>

<div id="resultadoA" class="resultado"></div>
<div id="gatilhosPermitidosA" class="gatilhos-box"></div>
<button id="btnRegistrarA" style="display:none;" onclick="abrirModal('A')">📝 Registrar Trade</button>
</div>

<!-- ================= SMC ================= -->
<div class="container">
<h3>📈 SMC</h3>

<label>Setup</label>
<select id="gatilhoB">
<option></option>
<option>Captura de liquidez em range</option>
<option>Captura de liquidez de BOS relevante</option>
</select>

<label>Tendência Macro</label>
<select id="macroB"><option></option><option>Alta</option><option>Baixa</option><option>Lateral</option></select>

<label>Tendência Micro</label>
<select id="microB"><option></option><option>Alta</option><option>Baixa</option><option>Lateral</option></select>

<label>CHOCH</label>
<select id="mm80B"><option></option><option>Sim</option><option>Não</option></select>

<label>VWAP oposta</label>
<select id="vwapB"><option></option><option>Distante</option><option>Proximo</option><option>Toque</option></select>

<label>Capturou liquidez?</label>
<select id="estocB"><option></option><option>Sim</option><option>Não</option></select>

<label>FVG</label>
<select id="fvgB"><option></option><option>Sim</option><option>Não</option></select>

<label>OB Primário</label>
<select id="obpB"><option></option><option>Sim</option><option>Nao</option></select>

<label>OB Secundário</label>
<select id="obsB"><option></option><option>Sim</option><option>Nao</option></select>

<button onclick="avaliar('B')">Avaliar Setup</button>

<div id="resultadoB" class="resultado"></div>
<div id="gatilhosPermitidosB" class="gatilhos-box"></div>
<button id="btnRegistrarB" style="display:none;" onclick="abrirModal('B')">📝 Registrar Trade</button>
</div>

<!-- ================= OB / VWAP / POC ================= -->
<div class="container">
<h3>🎯 OB / VWAP / POC</h3>

<label>Setup</label>
<select id="gatilhoC">
<option></option>
<option>OB HTF</option>
<option>OB interno</option>
<option>VWAP</option>
<option>Volume Profile POC</option>
</select>

<label>Tendência Macro</label>
<select id="macroC"><option></option><option>Alta</option><option>Baixa</option><option>Lateral</option></select>

<label>Tendência Micro</label>
<select id="microC"><option></option><option>Alta</option><option>Baixa</option><option>Lateral</option></select>

<label>CHOCH</label>
<select id="mm80C"><option></option><option>Sim</option><option>Não</option></select>

<label>VWAP oposta</label>
<select id="vwapC"><option></option><option>Distante</option><option>Proximo</option><option>Toque</option></select>

<label>Capturou liquidez?</label>
<select id="estocC"><option></option><option>Sim</option><option>Não</option></select>

<label>FVG</label>
<select id="fvgC"><option></option><option>Sim</option><option>Não</option></select>

<label>OB Primário</label>
<select id="obpC"><option></option><option>Sim</option><option>Nao</option></select>

<label>OB Secundário</label>
<select id="obsC"><option></option><option>Sim</option><option>Nao</option></select>

<button onclick="avaliar('C')">Avaliar Setup</button>

<div id="resultadoC" class="resultado"></div>
<div id="gatilhosPermitidosC" class="gatilhos-box"></div>
<button id="btnRegistrarC" style="display:none;" onclick="abrirModal('C')">📝 Registrar Trade</button>
</div>

</div>

<div class="stats" id="estatisticas"></div>
<button onclick="exportarCSV()">📥 Exportar CSV</button>
<button onclick="limparHistorico()">🗑️ Limpar Histórico</button>

<div class="modal" id="modal">
<div class="modal-content">
<h3 style="margin-bottom: 20px; border-bottom: none;">Registrar Trade</h3>
<label>Alvo</label>
<select id="alvo">
<option>1:1R</option>
<option>1:2R</option>
<option>1:3R</option>
<option>Stop</option>
</select>

<label>Parcial?</label>
<select id="parcial">
<option>Sim</option>
<option>Não</option>
</select>

<button onclick="salvarTrade()">Confirmar Registro</button>
</div>
</div>

<script>

let trades = JSON.parse(localStorage.getItem("tradesSMC")) || [];
let ultimoResultado = {};
let origemAtual = null;

function avaliar(prefix){

origemAtual = prefix;

let setupValue = document.getElementById("gatilho"+prefix).value;
let macroValue = document.getElementById("macro"+prefix).value;
let microValue = document.getElementById("micro"+prefix).value;
let mm80Value = document.getElementById("mm80"+prefix).value;
let vwapValue = document.getElementById("vwap"+prefix).value;
let estocValue = document.getElementById("estoc"+prefix).value;
let obpValue = document.getElementById("obp"+prefix).value;
let obsValue = document.getElementById("obs"+prefix).value;

if(setupValue===""){ alert("Selecione o setup."); return; }

let pontos = 0;
let resultado="";
let classe="";
let gatilhosPermitidos=[];
let bolinha="●";

/* TRAP */
if(prefix==="A"){

if(setupValue==="Trap na Máxima - VENDA"){
if(macroValue==="Baixa")pontos+=4;
if(macroValue==="Lateral")pontos+=2;
if(macroValue==="Alta")pontos+=1;
if(microValue==="Lateral")pontos+=2;
if(microValue==="Baixa")pontos+=1;
if(mm80Value==="Caindo")pontos+=3;
if(mm80Value==="Subindo")pontos+=2;
}

if(setupValue==="Trap na Mínima - COMPRA"){
if(macroValue==="Alta")pontos+=4;
if(macroValue==="Lateral")pontos+=2;
if(macroValue==="Baixa")pontos+=1;
if(microValue==="Lateral")pontos+=2;
if(microValue==="Alta")pontos+=1;
if(mm80Value==="Subindo")pontos+=3;
if(mm80Value==="Caindo")pontos+=2;
}

if(vwapValue==="Distante")pontos+=4;
if(vwapValue==="Proximo")pontos+=1;
if(estocValue==="Divergente")pontos+=2;
if(obpValue==="Sim")pontos+=2;
if(obsValue==="Sim")pontos+=1;

if(pontos>=14){
resultado="EXCELENTE";classe="excelente";
gatilhosPermitidos=["Rossadinha vwap","FF-FD vwap","PFR 10m","Inside bar reversão","CHOCH","POI"];
}
else if(pontos>=12){
resultado="BOM";classe="bom";
gatilhosPermitidos=["Rossadinha vwap","Inside bar reversão","POI","FF-FD vwap"];
}
else if(pontos>=8){
resultado="MÉDIO";classe="medio";
gatilhosPermitidos=["Inside bar reversão","POI"];
}
else{
resultado="FRACO";classe="fraco";
gatilhosPermitidos=["POI"];
}
}

/* SMC + C */
if(prefix==="B"||prefix==="C"){

if(setupValue==="Captura de liquidez em range") pontos+=3;
if(setupValue==="Captura de liquidez de BOS relevante") pontos+=4;
if(setupValue==="OB HTF") pontos+=4;
if(setupValue==="OB interno") pontos+=2;
if(setupValue==="VWAP") pontos+=2;
if(setupValue==="Volume Profile POC") pontos+=2;

if(macroValue==="Alta"||macroValue==="Baixa") pontos+=3;
if(macroValue==="Lateral") pontos+=1;

if(microValue==="Alta"||microValue==="Baixa") pontos+=2;

if(mm80Value==="Sim") pontos+=4;

if(vwapValue==="Distante") pontos+=3;
if(vwapValue==="Proximo") pontos+=1;

if(estocValue==="Sim") pontos+=3;

let fvgValue=document.getElementById("fvg"+prefix).value;
if(fvgValue==="Sim") pontos+=2;

if(obpValue==="Sim") pontos+=2;
if(obsValue==="Sim") pontos+=1;

let temChoCh=(mm80Value==="Sim");

if(pontos>=18 && temChoCh){
resultado="EXCELENTE";classe="excelente";
gatilhosPermitidos=["CHOCH","OB HTF","FVG","POI"];
}
else if(pontos>=14){
resultado="BOM";classe="bom";
gatilhosPermitidos=["CHOCH","OB HTF","POI"];
}
else if(pontos>=9){
resultado="MÉDIO";classe="medio";
gatilhosPermitidos=["POI"];
}
else{
resultado="FRACO";classe="fraco";
gatilhosPermitidos=["POI"];
}
}

let resultadoDiv=document.getElementById("resultado"+prefix);
resultadoDiv.className="resultado "+classe;
resultadoDiv.innerHTML=`${bolinha} ${resultado}<br>Pontuação: ${pontos}`;

let gatilhosDiv=document.getElementById("gatilhosPermitidos"+prefix);
let html="<strong>Gatilhos Autorizados:</strong><br>";
gatilhosPermitidos.forEach(g=>{
html+=`<label><input type="radio" name="gatilhoExec${prefix}" value="${g}"> ${g}</label><br>`;
});
gatilhosDiv.innerHTML=html;
document.getElementById("btnRegistrar"+prefix).style.display="block";

let agora=new Date();
ultimoResultado={
data:agora.toLocaleDateString(),
hora:agora.toLocaleTimeString(),
origem:prefix,
setup:setupValue,
macro:macroValue,
micro:microValue,
mm80:mm80Value,
vwap:vwapValue,
estoc:estocValue,
obp:obpValue,
obs:obsValue,
pontos,
resultado
};
}

function abrirModal(prefix){
origemAtual=prefix;
document.getElementById("modal").style.display="flex";
}

function salvarTrade(){
let radioSelecionado=document.querySelector(`input[name="gatilhoExec${origemAtual}"]:checked`);
if(!radioSelecionado){alert("Selecione o gatilho executado.");return;}

let alvoValue=document.getElementById("alvo").value;
let parcialValue=document.getElementById("parcial").value;
let gatilhoExecutado=radioSelecionado.value;

let r=0;
if(alvoValue==="1:1R")r=1;
if(alvoValue==="1:2R")r=2;
if(alvoValue==="1:3R")r=3;
if(alvoValue==="Stop")r=-1;

let trade={...ultimoResultado,gatilhoExecutado,alvo:alvoValue,parcial:parcialValue,r};
trades.push(trade);
localStorage.setItem("tradesSMC",JSON.stringify(trades));

document.getElementById("modal").style.display="none";
atualizarEstatisticas();
}

function atualizarEstatisticas(){
let total=trades.length;
let wins=trades.filter(t=>t.r>0).length;
let stops=trades.filter(t=>t.r<0).length;
let rTotal=trades.reduce((acc,t)=>acc+t.r,0);
let winrate= total?((wins/total)*100).toFixed(1):0;
let payoff= total?(rTotal/total).toFixed(2):0;

document.getElementById("estatisticas").innerHTML=
`<span>📊 Total: ${total}</span>
<span>✅ Wins: ${wins}</span>
<span>❌ Stops: ${stops}</span>
<span>📈 Winrate: ${winrate}%</span>
<span>💰 R Total: ${rTotal}</span>
<span>📉 Payoff Médio: ${payoff}R</span>`;
}

function exportarCSV(){
let csv="Data,Hora,Origem,Setup,GatilhoExecutado,Macro,Micro,MM80,VWAP,Estoc,OBPrimario,OBSecundario,Pontos,Resultado,Alvo,Parcial,R\n";
trades.forEach(t=>{
csv+=`${t.data},${t.hora},${t.origem},${t.setup},${t.gatilhoExecutado},${t.macro},${t.micro},${t.mm80},${t.vwap},${t.estoc},${t.obp},${t.obs},${t.pontos},${t.resultado},${t.alvo},${t.parcial},${t.r}\n`;
});
let blob=new Blob([csv],{type:"text/csv"});
let link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download="trades_smc.csv";
link.click();
}

function limparHistorico(){
if(confirm("Deseja apagar todo histórico?")){
trades=[];
localStorage.removeItem("tradesSMC");
atualizarEstatisticas();
}
}

atualizarEstatisticas();

</script>
</body>
</html>
