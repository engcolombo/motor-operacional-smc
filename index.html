<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Motor Operacional SMC</title>

<link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet"/>

<style>
body {
    background: linear-gradient(135deg, #e6f0ff, #d0e3ff);
    min-height: 100vh;
}

.page {
    padding: 40px 20px;
}

.card {
    border-radius: 16px;
    box-shadow: 0 15px 35px rgba(0, 82, 204, 0.08);
}

.card-header {
    background: transparent;
    border-bottom: 1px solid #e6edf7;
}

.form-select, .btn {
    border-radius: 12px;
}

.resultado {
    margin-top: 15px;
    padding: 15px;
    border-radius: 12px;
    font-weight: 600;
    text-align: center;
}

.excelente { background:#dbeafe; color:#1e40af; }
.bom { background:#dcfce7; color:#166534; }
.medio { background:#fef9c3; color:#854d0e; }
.fraco { background:#fee2e2; color:#991b1b; }

.gatilhos-box {
    background:#f1f5f9;
    padding:12px;
    border-radius:12px;
    margin-top:15px;
}

.stats {
    margin-top:30px;
    padding:20px;
    border-radius:16px;
    background:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

.modal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    justify-content:center;
    align-items:center;
}

.modal-content {
    background:white;
    padding:25px;
    width:320px;
    border-radius:16px;
}
</style>
</head>

<body>

<div class="page">
<div class="container-xl">
<div class="row g-4">

<!-- TRAP -->
<div class="col-md-4">
<div class="card">
<div class="card-header"><h3 class="card-title">TRAP máxima e mínima</h3></div>
<div class="card-body">

<label class="form-label">Setup</label>
<select id="gatilhoA" class="form-select">
<option></option>
<option>Trap na Máxima - VENDA</option>
<option>Trap na Mínima - COMPRA</option>
</select>

<label class="form-label">Tendência Macro</label>
<select id="macroA" class="form-select">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<label class="form-label">Tendência Micro</label>
<select id="microA" class="form-select">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<label class="form-label">MM80</label>
<select id="mm80A" class="form-select">
<option></option><option>Subindo</option><option>Caindo</option>
</select>

<label class="form-label">VWAP</label>
<select id="vwapA" class="form-select">
<option></option><option>Distante</option><option>Proximo</option><option>Toque</option>
</select>

<label class="form-label">Estocástico</label>
<select id="estocA" class="form-select">
<option></option><option>Divergente</option><option>Nao divergente</option>
</select>

<label class="form-label">OB Primário</label>
<select id="obpA" class="form-select">
<option></option><option>Sim</option><option>Nao</option>
</select>

<label class="form-label">OB Secundário</label>
<select id="obsA" class="form-select">
<option></option><option>Sim</option><option>Nao</option>
</select>

<button class="btn btn-primary w-100 mt-3" onclick="avaliar('A')">Avaliar</button>

<div id="resultadoA" class="resultado"></div>
<div id="gatilhosPermitidosA" class="gatilhos-box"></div>
<button id="btnRegistrarA" class="btn btn-outline-primary w-100 mt-2" style="display:none;" onclick="abrirModal('A')">Registrar Trade</button>

</div>
</div>
</div>

<!-- SMC -->
<div class="col-md-4">
<div class="card">
<div class="card-header"><h3 class="card-title">SMC</h3></div>
<div class="card-body">

<label class="form-label">Setup</label>
<select id="gatilhoB" class="form-select">
<option></option>
<option>Captura de liquidez em range</option>
<option>Captura de liquidez de BOS relevante</option>
</select>

<label class="form-label">Tendência Macro</label>
<select id="macroB" class="form-select">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<label class="form-label">Tendência Micro</label>
<select id="microB" class="form-select">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<label class="form-label">CHOCH</label>
<select id="mm80B" class="form-select">
<option></option><option>Sim</option><option>Não</option>
</select>

<label class="form-label">VWAP oposta</label>
<select id="vwapB" class="form-select">
<option></option><option>Distante</option><option>Proximo</option><option>Toque</option>
</select>

<label class="form-label">Capturou liquidez?</label>
<select id="estocB" class="form-select">
<option></option><option>Sim</option><option>Não</option>
</select>

<label class="form-label">FVG</label>
<select id="fvgB" class="form-select">
<option></option><option>Sim</option><option>Não</option>
</select>

<label class="form-label">OB Primário</label>
<select id="obpB" class="form-select">
<option></option><option>Sim</option><option>Nao</option>
</select>

<label class="form-label">OB Secundário</label>
<select id="obsB" class="form-select">
<option></option><option>Sim</option><option>Nao</option>
</select>

<button class="btn btn-primary w-100 mt-3" onclick="avaliar('B')">Avaliar</button>

<div id="resultadoB" class="resultado"></div>
<div id="gatilhosPermitidosB" class="gatilhos-box"></div>
<button id="btnRegistrarB" class="btn btn-outline-primary w-100 mt-2" style="display:none;" onclick="abrirModal('B')">Registrar Trade</button>

</div>
</div>
</div>

<!-- OB / VWAP / POC -->
<div class="col-md-4">
<div class="card">
<div class="card-header"><h3 class="card-title">OB / VWAP / POC</h3></div>
<div class="card-body">

<label class="form-label">Setup</label>
<select id="gatilhoC" class="form-select">
<option></option>
<option>OB HTF</option>
<option>OB interno</option>
<option>VWAP</option>
<option>Volume Profile POC</option>
</select>

<label class="form-label">Tendência Macro</label>
<select id="macroC" class="form-select">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<label class="form-label">Tendência Micro</label>
<select id="microC" class="form-select">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<label class="form-label">CHOCH</label>
<select id="mm80C" class="form-select">
<option></option><option>Sim</option><option>Não</option>
</select>

<label class="form-label">VWAP oposta</label>
<select id="vwapC" class="form-select">
<option></option><option>Distante</option><option>Proximo</option><option>Toque</option>
</select>

<label class="form-label">Capturou liquidez?</label>
<select id="estocC" class="form-select">
<option></option><option>Sim</option><option>Não</option>
</select>

<label class="form-label">FVG</label>
<select id="fvgC" class="form-select">
<option></option><option>Sim</option><option>Não</option>
</select>

<label class="form-label">OB Primário</label>
<select id="obpC" class="form-select">
<option></option><option>Sim</option><option>Nao</option>
</select>

<label class="form-label">OB Secundário</label>
<select id="obsC" class="form-select">
<option></option><option>Sim</option><option>Nao</option>
</select>

<button class="btn btn-primary w-100 mt-3" onclick="avaliar('C')">Avaliar</button>

<div id="resultadoC" class="resultado"></div>
<div id="gatilhosPermitidosC" class="gatilhos-box"></div>
<button id="btnRegistrarC" class="btn btn-outline-primary w-100 mt-2" style="display:none;" onclick="abrirModal('C')">Registrar Trade</button>

</div>
</div>
</div>

</div>

<div class="stats mt-4" id="estatisticas"></div>
<div class="d-flex gap-2 mt-3">
<button class="btn btn-success" onclick="exportarCSV()">Exportar CSV</button>
<button class="btn btn-danger" onclick="limparHistorico()">Limpar Histórico</button>
</div>

</div>
</div>

<div class="modal" id="modal">
<div class="modal-content">
<label class="form-label">Alvo</label>
<select id="alvo" class="form-select">
<option>1:1R</option>
<option>1:2R</option>
<option>1:3R</option>
<option>Stop</option>
</select>

<label class="form-label mt-3">Parcial?</label>
<select id="parcial" class="form-select">
<option>Sim</option>
<option>Não</option>
</select>

<button class="btn btn-primary w-100 mt-3" onclick="salvarTrade()">Salvar</button>
</div>
</div>

<!-- SEU SCRIPT ORIGINAL AQUI SEM ALTERAÇÃO -->
<script>
/* COLE AQUI EXATAMENTE SEU SCRIPT ORIGINAL SEM MODIFICAR NADA */
</script>

</body>
</html>
