<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Motor Operacional SMC</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
    padding: 40px;
}

.container {
    background: white;
    padding: 30px;
    max-width: 600px;
    margin: auto;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

select, button {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    font-size: 14px;
}

button {
    background-color: #003366;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background-color: #002244;
}

.resultado {
    margin-top: 20px;
    padding: 20px;
    border-radius: 6px;
    font-weight: bold;
    text-align: center;
}

.excelente { background:#cce5ff; color:#004085; }
.muito { background:#d4edda; color:#155724; }
.medio { background:#fff3cd; color:#856404; }
.fraco { background:#ffe5b4; color:#8a4b00; }
.evitar { background:#f8d7da; color:#721c24; }

</style>
</head>

<body>

<div class="container">
<h1>Motor Operacional SMC – Trap D-1</h1>

<select id="gatilho">
<option value="">Selecione o Gatilho</option>
<option>Trap Máxima D-1</option>
<option>Trap Mínima D-1</option>
</select>

<select id="macro">
<option value="">Tendência Macro</option>
<option>Alta</option>
<option>Baixa</option>
<option>Lateral</option>
</select>

<select id="micro">
<option value="">Tendência Micro</option>
<option>Alta</option>
<option>Baixa</option>
<option>Lateral</option>
</select>

<select id="mm80">
<option value="">MM80</option>
<option>Subindo</option>
<option>Caindo</option>
</select>

<select id="vwap">
<option value="">VWAP</option>
<option>Distante</option>
<option>Proximo</option>
<option>Toque</option>
</select>

<select id="estoc">
<option value="">Estocástico</option>
<option>Divergente</option>
<option>Nao divergente</option>
</select>

<select id="obp">
<option value="">OB Primário</option>
<option>Sim</option>
<option>Nao</option>
</select>

<select id="obs">
<option value="">OB Secundário</option>
<option>Sim</option>
<option>Nao</option>
</select>

<button onclick="avaliar()">Avaliar Trap</button>

<div id="resultado"></div>

</div>

<script>

function avaliar() {

let gatilho = document.getElementById("gatilho").value;
let macro = document.getElementById("macro").value;
let micro = document.getElementById("micro").value;
let mm80 = document.getElementById("mm80").value;
let vwap = document.getElementById("vwap").value;
let estoc = document.getElementById("estoc").value;
let obp = document.getElementById("obp").value;
let obs = document.getElementById("obs").value;

let pontos = 0;

if(gatilho === "") {
    alert("Selecione o gatilho primeiro.");
    return;
}

if(gatilho === "Trap Máxima D-1") {

    if(macro === "Baixa") pontos += 4;
    if(macro === "Lateral") pontos += 3;
    if(macro === "Alta") pontos += 1;

    if(micro === "Lateral") pontos += 2;
    if(micro === "Baixa") pontos += 1;
    if(micro === "Alta") pontos += 0;

    if(mm80 === "Caindo") pontos += 3;
    if(mm80 === "Subindo") pontos += 2;
}

if(gatilho === "Trap Mínima D-1") {

    if(macro === "Alta") pontos += 4;
    if(macro === "Lateral") pontos += 3;
    if(macro === "Baixa") pontos += 1;

    if(micro === "Lateral") pontos += 2;
    if(micro === "Alta") pontos += 1;
    if(micro === "Baixa") pontos += 0;

    if(mm80 === "Subindo") pontos += 3;
    if(mm80 === "Caindo") pontos += 2;
}

if(vwap === "Distante") pontos += 4;
if(vwap === "Proximo") pontos += 2;
if(vwap === "Toque") pontos += 1;

if(estoc === "Divergente") pontos += 2;
if(obp === "Sim") pontos += 2;
if(obs === "Sim") pontos += 1;

let resultadoDiv = document.getElementById("resultado");

let classe = "";
let texto = "";

if(pontos >= 14) { classe="excelente"; texto="🔵 EXCELENTE"; }
else if(pontos >= 12) { classe="muito"; texto="🟢  BOM"; }
else if(pontos >= 8) { classe="medio"; texto="🟡 MÉDIO"; }
else if(pontos >= 4) { classe="fraco"; texto="🟠 FRACO"; }
else { classe="evitar"; texto="🔴 EVITAR"; }

resultadoDiv.className = "resultado " + classe;
resultadoDiv.innerHTML = texto + "<br>Pontuação: " + pontos;

}

</script>

</body>
</html>
