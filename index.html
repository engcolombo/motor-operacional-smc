<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Motor Operacional SMC</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
    padding: 30px;
}

.wrapper {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
}

.container {
    background: white;
    padding: 20px;
    width: 360px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

label {
    font-weight: bold;
    font-size: 13px;
    margin-top: 6px;
    display: block;
}

select, button, textarea {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
    font-size: 14px;
}

button {
    background-color: #003366;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background-color: #002244;
}

.resultado {
    margin-top: 10px;
    padding: 15px;
    border-radius: 6px;
    font-weight: bold;
    text-align: center;
}

.excelente { background:#cce5ff; color:#004085; }
.muito { background:#d4edda; color:#155724; }
.medio { background:#fff3cd; color:#856404; }
.fraco { background:#ffe5b4; color:#8a4b00; }
.evitar { background:#f8d7da; color:#721c24; }

.gatilhosBox {
    margin-top: 10px;
    padding: 10px;
    background: #f1f1f1;
    border-radius: 6px;
    font-size: 13px;
}

/* MODAL */
.modal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
}

.modal-content {
    background:white;
    padding:20px;
    width:300px;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="wrapper">
<div class="container">

<label>Setup</label>
<select id="gatilho">
<option value=""></option>
<option>Trap na Máxima - VENDA</option>
<option>Trap na Mínima - COMPRA</option>
</select>

<label>Tendência Macro</label>
<select id="macro">
<option value=""></option>
<option>Alta</option>
<option>Baixa</option>
<option>Lateral</option>
</select>

<label>Tendência Micro</label>
<select id="micro">
<option value=""></option>
<option>Alta</option>
<option>Baixa</option>
<option>Lateral</option>
</select>

<label>MM80</label>
<select id="mm80">
<option value=""></option>
<option>Subindo</option>
<option>Caindo</option>
</select>

<label>VWAP</label>
<select id="vwap">
<option value=""></option>
<option>Distante</option>
<option>Proximo</option>
<option>Toque</option>
</select>

<label>Estocástico</label>
<select id="estoc">
<option value=""></option>
<option>Divergente</option>
<option>Nao divergente</option>
</select>

<label>OB Primário</label>
<select id="obp">
<option value=""></option>
<option>Sim</option>
<option>Nao</option>
</select>

<label>OB Secundário</label>
<select id="obs">
<option value=""></option>
<option>Sim</option>
<option>Nao</option>
</select>

<button onclick="avaliar()">Avaliar</button>

<div id="resultado" class="resultado"></div>
<div id="gatilhosAutorizados" class="gatilhosBox"></div>

<button id="btnRegistrar" style="display:none;" onclick="abrirModal()">Registrar Trade</button>
<button id="btnExportar" style="display:none;" onclick="exportarCSV()">Exportar CSV</button>

</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">

<label>Alvo</label>
<select id="alvo">
<option>1:1R</option>
<option>1:2R</option>
<option>1:3R</option>
<option>Stop</option>
</select>

<label>Parcial?</label>
<select id="parcial">
<option>Sim</option>
<option>Não</option>
</select>

<label>Observação</label>
<textarea id="obsTrade"></textarea>

<button onclick="salvarTrade()">Salvar</button>

</div>
</div>

<script>

let trades = [];
let ultimoResultado = {};

function avaliar(){

let gatilho = document.getElementById("gatilho").value;
let macro = document.getElementById("macro").value;
let micro = document.getElementById("micro").value;
let mm80 = document.getElementById("mm80").value;
let vwap = document.getElementById("vwap").value;
let estoc = document.getElementById("estoc").value;
let obp = document.getElementById("obp").value;
let obs = document.getElementById("obs").value;

let pontos = 0;

if(gatilho===""){ alert("Selecione o setup"); return; }

if(gatilho==="Trap na Máxima - VENDA"){
if(macro==="Baixa")pontos+=4;
if(macro==="Lateral")pontos+=2;
if(macro==="Alta")pontos+=1;
if(micro==="Lateral")pontos+=2;
if(micro==="Baixa")pontos+=1;
if(mm80==="Caindo")pontos+=3;
if(mm80==="Subindo")pontos+=2;
}

if(gatilho==="Trap na Mínima - COMPRA"){
if(macro==="Alta")pontos+=4;
if(macro==="Lateral")pontos+=2;
if(macro==="Baixa")pontos+=1;
if(micro==="Lateral")pontos+=2;
if(micro==="Alta")pontos+=1;
if(mm80==="Subindo")pontos+=3;
if(mm80==="Caindo")pontos+=2;
}

if(vwap==="Distante")pontos+=4;
if(vwap==="Proximo")pontos+=1;
if(estoc==="Divergente")pontos+=2;
if(obp==="Sim")pontos+=2;
if(obs==="Sim")pontos+=1;

if(gatilho==="Trap na Máxima - VENDA" && macro==="Alta" && pontos>13)pontos=13;
if(gatilho==="Trap na Mínima - COMPRA" && macro==="Baixa" && pontos>13)pontos=13;

let resultado="";
if(pontos>=14)resultado="EXCELENTE";
else if(pontos>=12)resultado="BOM";
else if(pontos>=8)resultado="MÉDIO";
else if(pontos>=4)resultado="FRACO";
else resultado="EVITAR";

document.getElementById("resultado").innerHTML=resultado+"<br>Pontuação: "+pontos;

if(resultado!=="EVITAR"){
document.getElementById("btnRegistrar").style.display="block";
}else{
document.getElementById("btnRegistrar").style.display="none";
}

ultimoResultado={
data:new Date().toLocaleString(),
setup:gatilho,
macro, micro, mm80, vwap, estoc, obp, obs,
pontos, resultado
};
}

function abrirModal(){
document.getElementById("modal").style.display="flex";
}

function salvarTrade(){

let alvo=document.getElementById("alvo").value;
let parcial=document.getElementById("parcial").value;
let observacao=document.getElementById("obsTrade").value;

let trade={...ultimoResultado, alvo, parcial, observacao};

trades.push(trade);

document.getElementById("modal").style.display="none";
document.getElementById("btnExportar").style.display="block";
alert("Trade registrado!");
}

function exportarCSV(){

let csv="Data,Setup,Macro,Micro,MM80,VWAP,Estoc,OBPrimario,OBSecundario,Pontos,Resultado,Alvo,Parcial,Observacao\n";

trades.forEach(t=>{
csv+=`${t.data},${t.setup},${t.macro},${t.micro},${t.mm80},${t.vwap},${t.estoc},${t.obp},${t.obs},${t.pontos},${t.resultado},${t.alvo},${t.parcial},${t.observacao}\n`;
});

let blob=new Blob([csv],{type:"text/csv"});
let link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download="trades_smc.csv";
link.click();
}

</script>

</body>
</html>
