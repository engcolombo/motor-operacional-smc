<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Motor Operacional SMC</title>

<style>

body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
    padding: 30px;
}

/* Container geral permite múltiplos cards lado a lado */
.wrapper {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
}

/* Card compacto */
.container {
    background: white;
    padding: 20px;
    width: 360px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

h1 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 18px;
}

label {
    font-weight: bold;
    font-size: 13px;
    margin-top: 6px;
    display: block;
}

select, button {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
    font-size: 14px;
}

button {
    background-color: #003366;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background-color: #002244;
}

.resultado {
    margin-top: 10px;
    padding: 15px;
    border-radius: 6px;
    font-weight: bold;
    text-align: center;
}

.excelente { background:#cce5ff; color:#004085; }
.muito { background:#d4edda; color:#155724; }
.medio { background:#fff3cd; color:#856404; }
.fraco { background:#ffe5b4; color:#8a4b00; }
.evitar { background:#f8d7da; color:#721c24; }

.gatilhosBox {
    margin-top: 10px;
    padding: 10px;
    background: #f1f1f1;
    border-radius: 6px;
    font-size: 13px;
}

</style>
</head>

<body>

<div class="wrapper">

<div class="container">
<h1>Trap D-1</h1>

<label>Setup</label>
<select id="gatilho">
<option value=""></option>
<option>Trap Máxima D-1</option>
<option>Trap Mínima D-1</option>
</select>

<label>Tendência Macro</label>
<select id="macro">
<option value=""></option>
<option>Alta</option>
<option>Baixa</option>
<option>Lateral</option>
</select>

<label>Tendência Micro</label>
<select id="micro">
<option value=""></option>
<option>Alta</option>
<option>Baixa</option>
<option>Lateral</option>
</select>

<label>MM80</label>
<select id="mm80">
<option value=""></option>
<option>Subindo</option>
<option>Caindo</option>
</select>

<label>VWAP</label>
<select id="vwap">
<option value=""></option>
<option>Distante</option>
<option>Proximo</option>
<option>Toque</option>
</select>

<label>Estocástico</label>
<select id="estoc">
<option value=""></option>
<option>Divergente</option>
<option>Nao divergente</option>
</select>

<label>OB Primário</label>
<select id="obp">
<option value=""></option>
<option>Sim</option>
<option>Nao</option>
</select>

<label>OB Secundário</label>
<select id="obs">
<option value=""></option>
<option>Sim</option>
<option>Nao</option>
</select>

<button onclick="avaliar()">Avaliar</button>

<div id="resultado" class="resultado"></div>

<div id="gatilhosAutorizados" class="gatilhosBox"></div>

</div>
</div>

<script>

function avaliar() {

let gatilho = document.getElementById("gatilho").value;
let macro = document.getElementById("macro").value;
let micro = document.getElementById("micro").value;
let mm80 = document.getElementById("mm80").value;
let vwap = document.getElementById("vwap").value;
let estoc = document.getElementById("estoc").value;
let obp = document.getElementById("obp").value;
let obs = document.getElementById("obs").value;

let pontos = 0;

if(gatilho === "") {
    alert("Selecione o setup.");
    return;
}

/* TRAP MÁXIMA */

if(gatilho === "Trap Máxima D-1") {

    if(macro === "Baixa") pontos += 4;
    if(macro === "Lateral") pontos += 2;
    if(macro === "Alta") pontos += 1;

    if(micro === "Lateral") pontos += 2;
    if(micro === "Baixa") pontos += 1;

    if(mm80 === "Caindo") pontos += 3;
    if(mm80 === "Subindo") pontos += 2;
}

/* TRAP MÍNIMA */

if(gatilho === "Trap Mínima D-1") {

    if(macro === "Alta") pontos += 4;
    if(macro === "Lateral") pontos += 2;
    if(macro === "Baixa") pontos += 1;

    if(micro === "Lateral") pontos += 2;
    if(micro === "Alta") pontos += 1;

    if(mm80 === "Subindo") pontos += 3;
    if(mm80 === "Caindo") pontos += 2;
}

/* FATORES GERAIS */

if(vwap === "Distante") pontos += 4;
if(vwap === "Proximo") pontos += 1;

if(estoc === "Divergente") pontos += 2;
if(obp === "Sim") pontos += 2;
if(obs === "Sim") pontos += 1;

/* TETO ESTRUTURAL */

if(gatilho === "Trap Máxima D-1" && macro === "Alta") {
    if(pontos > 13) pontos = 13;
}

if(gatilho === "Trap Mínima D-1" && macro === "Baixa") {
    if(pontos > 13) pontos = 13;
}

/* CLASSIFICAÇÃO */

let resultadoDiv = document.getElementById("resultado");
let gatilhosDiv = document.getElementById("gatilhosAutorizados");

let classe = "";
let texto = "";
let autorizados = [];

if(pontos >= 14) {
    classe="excelente";
    texto="🔵 EXCELENTE";
    autorizados = ["Rossadinha vwap","FF-FD vwap","PFR 10m","Inside bar reversão","CHOCH","POI"];
}
else if(pontos >= 12) {
    classe="muito";
    texto="🟢 BOM";
    autorizados = ["Rossadinha vwap","Inside bar reversão","POI","FF-FD vwap"];
}
else if(pontos >= 8) {
    classe="medio";
    texto="🟡 MÉDIO";
    autorizados = ["Inside bar reversão","POI"];
}
else if(pontos >= 4) {
    classe="fraco";
    texto="🟠 FRACO";
    autorizados = ["POI"];
}
else {
    classe="evitar";
    texto="🔴 EVITAR";
    autorizados = [];
}

resultadoDiv.className = "resultado " + classe;
resultadoDiv.innerHTML = texto + "<br>Pontuação: " + pontos;

/* Mostra gatilhos abaixo do resultado */

if(autorizados.length === 0){
    gatilhosDiv.innerHTML = "<strong>Gatilhos Autorizados:</strong><br>Nenhum";
} else {
    gatilhosDiv.innerHTML = "<strong>Gatilhos Autorizados:</strong><br>" + autorizados.join("<br>");
}

}

</script>

</body>
</html>
