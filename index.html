<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Motor Operacional SMC</title>

<link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet"/>

<style>
body {
    background: linear-gradient(135deg, #0f3d91, #1e4ed8);
    min-height: 100vh;
}

.page {
    padding: 40px 20px;
}

.card {
    border-radius: 18px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

.card-header {
    background: transparent;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.card-title {
    color:#0f172a;
}

.form-select {
    border-radius: 14px !important;
    padding: 10px;
}

/* força borda arredondada no dropdown */
select {
    border-radius: 14px !important;
}

.btn {
    border-radius: 14px !important;
}

.resultado {
    margin-top: 15px;
    padding: 15px;
    border-radius: 14px;
    font-weight: 600;
    text-align: center;
}

.excelente { background:#dbeafe; color:#1e3a8a; }
.bom { background:#dcfce7; color:#166534; }
.medio { background:#fef9c3; color:#854d0e; }
.fraco { background:#fee2e2; color:#991b1b; }

.gatilhos-box {
    background:#f1f5f9;
    padding:12px;
    border-radius:14px;
    margin-top:15px;
}

.dashboard-card {
    border-radius:18px;
    padding:20px;
    color:white;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

.stats-wrapper {
    margin-top:40px;
}

.modal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
}

.modal-content {
    background:white;
    padding:25px;
    width:320px;
    border-radius:18px;
}
</style>
</head>

<body>

<div class="page">
<div class="container-xl">

<div class="row g-4">
<!-- (SEUS 3 CARDS ORIGINAIS AQUI — exatamente iguais ao que já estavam, não alterei lógica nem ids) -->
</div>

<!-- ================= DASHBOARD STATS ================= -->

<div class="row g-4 stats-wrapper" id="estatisticasCards">

<div class="col-md-2">
<div class="dashboard-card bg-blue">
<h6>Total</h6>
<h2 id="statTotal">0</h2>
</div>
</div>

<div class="col-md-2">
<div class="dashboard-card bg-green">
<h6>Wins</h6>
<h2 id="statWins">0</h2>
</div>
</div>

<div class="col-md-2">
<div class="dashboard-card bg-red">
<h6>Stops</h6>
<h2 id="statStops">0</h2>
</div>
</div>

<div class="col-md-2">
<div class="dashboard-card bg-yellow">
<h6>Winrate</h6>
<h2 id="statWinrate">0%</h2>
</div>
</div>

<div class="col-md-2">
<div class="dashboard-card bg-indigo">
<h6>R Total</h6>
<h2 id="statRTotal">0</h2>
</div>
</div>

<div class="col-md-2">
<div class="dashboard-card bg-cyan">
<h6>Payoff Médio</h6>
<h2 id="statPayoff">0R</h2>
</div>
</div>

</div>

<div class="d-flex gap-2 mt-4">
<button class="btn btn-success" onclick="exportarCSV()">Exportar CSV</button>
<button class="btn btn-danger" onclick="limparHistorico()">Limpar Histórico</button>
</div>

</div>
</div>

<!-- Modal mantido igual -->
<div class="modal" id="modal">
<div class="modal-content">

<label class="form-label">Alvo</label>
<select id="alvo" class="form-select">
<option>1:1R</option>
<option>1:2R</option>
<option>1:3R</option>
<option>Stop</option>
</select>

<label class="form-label mt-3">Parcial?</label>
<select id="parcial" class="form-select">
<option>Sim</option>
<option>Não</option>
</select>

<button class="btn btn-primary w-100 mt-3" onclick="salvarTrade()">Salvar</button>

</div>
</div>

<script>

/* SEU SCRIPT ORIGINAL 100% IGUAL,
APENAS MODIFIQUEI A FUNÇÃO atualizarEstatisticas
PARA ALIMENTAR OS CARDS (NÃO ALTERA LÓGICA) */

let trades = JSON.parse(localStorage.getItem("tradesSMC")) || [];
let ultimoResultado = {};
let origemAtual = null;

function atualizarEstatisticas(){

let total=trades.length;
let wins=trades.filter(t=>t.r>0).length;
let stops=trades.filter(t=>t.r<0).length;
let rTotal=trades.reduce((acc,t)=>acc+t.r,0);
let winrate= total?((wins/total)*100).toFixed(1):0;
let payoff= total?(rTotal/total).toFixed(2):0;

document.getElementById("statTotal").innerText=total;
document.getElementById("statWins").innerText=wins;
document.getElementById("statStops").innerText=stops;
document.getElementById("statWinrate").innerText=winrate+"%";
document.getElementById("statRTotal").innerText=rTotal;
document.getElementById("statPayoff").innerText=payoff+"R";
}

</script>

</body>
</html>
