<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Motor Operacional SMC</title>

<style>
body { font-family: Arial; background:#f4f6f8; padding:30px; }
.wrapper { display:flex; gap:20px; justify-content:center; flex-wrap:wrap; }

.container {
    background:white;
    padding:20px;
    width:380px;
    border-radius:8px;
    box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

label { font-weight:bold; font-size:13px; margin-top:6px; display:block; }
select, button { width:100%; padding:8px; margin-bottom:10px; font-size:14px; }

button { background:#003366; color:white; border:none; cursor:pointer; }
button:hover { background:#002244; }

.resultado {
    margin-top:10px;
    padding:15px;
    border-radius:6px;
    font-weight:bold;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.excelente { background:#cce5ff; color:#004085; }
.bom { background:#d4edda; color:#155724; }
.medio { background:#fff3cd; color:#856404; }
.fraco { background:#f8d7da; color:#721c24; }

.gatilhos-box {
    background:#f1f1f1;
    padding:10px;
    border-radius:6px;
    margin-top:10px;
    font-size:13px;
}

.stats {
    margin-top:20px;
    padding:15px;
    background:#e9ecef;
    border-radius:6px;
    font-size:13px;
}

.modal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
}

.modal-content {
    background:white;
    padding:20px;
    width:300px;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- ================= SETUP A (ORIGINAL INTACTO) ================= -->
<!-- ================= TRAP ================= -->
<div class="container">
<h3>TRAP máxima e mínima</h3>

<label>Setup</label>
<select id="gatilhoA">
<option></option>
<option>Trap na Máxima - VENDA</option>
<option>Trap na Mínima - COMPRA</option>
</select>

<label>Tendência Macro</label>
<select id="macroA"><option></option><option>Alta</option><option>Baixa</option><option>Lateral</option></select>

<label>Tendência Micro</label>
<select id="microA"><option></option><option>Alta</option><option>Baixa</option><option>Lateral</option></select>

<label>MM80</label>
<select id="mm80A"><option></option><option>Subindo</option><option>Caindo</option></select>

<label>VWAP</label>
<select id="vwapA"><option></option><option>Distante</option><option>Proximo</option><option>Toque</option></select>

<label>Estocástico</label>
<select id="estocA"><option></option><option>Divergente</option><option>Nao divergente</option></select>

<label>OB Primário</label>
<select id="obpA"><option></option><option>Sim</option><option>Nao</option></select>

<label>OB Secundário</label>
<select id="obsA"><option></option><option>Sim</option><option>Nao</option></select>

<button onclick="avaliar('A')">Avaliar</button>

<div id="resultadoA" class="resultado"></div>
<div id="gatilhosPermitidosA" class="gatilhos-box"></div>
<button id="btnRegistrarA" style="display:none;" onclick="abrirModal('A')">Registrar Trade</button>
</div>

<!-- ================= SMC ================= -->
<div class="container">
<h3>SMC</h3>

<label>Setup</label>
<select id="gatilhoB">
<option></option>
<option>Captura de liquidez em range</option>
<option>Captura de liquidez de BOS relevante</option>
<option>OB HTF</option>
<option>OB interno</option>
<option>VWAP</option>
<option>Volume Profile POC</option>
</select>

<label>Tendência Macro</label>
<select id="macroB"><option></option><option>Alta</option><option>Baixa</option><option>Lateral</option></select>

<label>Tendência Micro</label>
<select id="microB"><option></option><option>Alta</option><option>Baixa</option><option>Lateral</option></select>

<label>CHOCH</label>
<select id="mm80B">
<option></option>
<option>Sim</option>
<option>Não</option>
</select>

<label>VWAP oposta</label>
<select id="vwapB">
<option></option>
<option>Distante</option>
<option>Proximo</option>
<option>Toque</option>
</select>

<label>Capturou liquidez?</label>
<select id="estocB">
<option></option>
<option>Sim</option>
<option>Não</option>
</select>

    <label>FVG</label>
<select id="fvgB">
<option></option>
<option>Sim</option>
<option>Não</option>
</select>

<label>OB Primário</label>
<select id="obpB"><option></option><option>Sim</option><option>Nao</option></select>

<label>OB Secundário</label>
<select id="obsB"><option></option><option>Sim</option><option>Nao</option></select>

<button onclick="avaliar('B')">Avaliar</button>

<div id="resultadoB" class="resultado"></div>
<div id="gatilhosPermitidosB" class="gatilhos-box"></div>
<button id="btnRegistrarB" style="display:none;" onclick="abrirModal('B')">Registrar Trade</button>
</div>

</div>

<!-- HISTÓRICO GLOBAL -->
<div class="stats" id="estatisticas"></div>

<button onclick="exportarCSV()">Exportar CSV</button>
<button onclick="limparHistorico()">Limpar Histórico</button>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">

<label>Alvo</label>
<select id="alvo">
<option>1:1R</option>
<option>1:2R</option>
<option>1:3R</option>
<option>Stop</option>
</select>

<label>Parcial?</label>
<select id="parcial">
<option>Sim</option>
<option>Não</option>
</select>

<button onclick="salvarTrade()">Salvar</button>

</div>
</div>

<script>

/* ================= LÓGICA ORIGINAL INTACTA ================= */

let trades = JSON.parse(localStorage.getItem("tradesSMC")) || [];
let ultimoResultado = {};
let origemAtual = null;

function avaliar(prefix){

origemAtual = prefix;

let setupValue = document.getElementById("gatilho"+prefix).value;
let macroValue = document.getElementById("macro"+prefix).value;
let microValue = document.getElementById("micro"+prefix).value;
let mm80Value = document.getElementById("mm80"+prefix).value;
let vwapValue = document.getElementById("vwap"+prefix).value;
let estocValue = document.getElementById("estoc"+prefix).value;
let obpValue = document.getElementById("obp"+prefix).value;
let obsValue = document.getElementById("obs"+prefix).value;

if(setupValue===""){ alert("Selecione o setup."); return; }

let pontos = 0;
let resultado="";
let classe="";
let gatilhosPermitidos=[];
let bolinha="●";

/* ================= TRAP ================= */
if(prefix === "A"){

    if(setupValue==="Trap na Máxima - VENDA"){
        if(macroValue==="Baixa")pontos+=4;
        if(macroValue==="Lateral")pontos+=2;
        if(macroValue==="Alta")pontos+=1;
        if(microValue==="Lateral")pontos+=2;
        if(microValue==="Baixa")pontos+=1;
        if(mm80Value==="Caindo")pontos+=3;
        if(mm80Value==="Subindo")pontos+=2;
    }

    if(setupValue==="Trap na Mínima - COMPRA"){
        if(macroValue==="Alta")pontos+=4;
        if(macroValue==="Lateral")pontos+=2;
        if(macroValue==="Baixa")pontos+=1;
        if(microValue==="Lateral")pontos+=2;
        if(microValue==="Alta")pontos+=1;
        if(mm80Value==="Subindo")pontos+=3;
        if(mm80Value==="Caindo")pontos+=2;
    }

    if(vwapValue==="Distante")pontos+=4;
    if(vwapValue==="Proximo")pontos+=1;
    if(estocValue==="Divergente")pontos+=2;
    if(obpValue==="Sim")pontos+=2;
    if(obsValue==="Sim")pontos+=1;

    if(pontos>=14){
        resultado="EXCELENTE";
        classe="excelente";
    }
    else if(pontos>=12){
        resultado="BOM";
        classe="bom";
    }
    else if(pontos>=8){
        resultado="MÉDIO";
        classe="medio";
    }
    else{
        resultado="FRACO";
        classe="fraco";
    }
}


/* ================= SMC ================= */
if(prefix === "B"){

    if(setupValue==="Captura de liquidez em range") pontos+=3;
    if(setupValue==="Captura de liquidez de BOS relevante") pontos+=4;
    if(setupValue==="OB HTF") pontos+=4;
    if(setupValue==="OB interno") pontos+=2;
    if(setupValue==="VWAP") pontos+=2;
    if(setupValue==="Volume Profile POC") pontos+=2;

    if(macroValue==="Alta" || macroValue==="Baixa") pontos+=3;
    if(macroValue==="Lateral") pontos+=1;

    if(microValue==="Alta" || microValue==="Baixa") pontos+=2;

    if(mm80Value==="Sim") pontos+=4;

    if(vwapValue==="Distante") pontos+=3;
    if(vwapValue==="Proximo") pontos+=1;

    if(estocValue==="Sim") pontos+=3;

    let fvgValue = document.getElementById("fvgB").value;
    if(fvgValue==="Sim") pontos+=2;

    if(obpValue==="Sim") pontos+=2;
    if(obsValue==="Sim") pontos+=1;

    let temChoCh = (mm80Value==="Sim");

    if(pontos>=18 && temChoCh){
        resultado="EXCELENTE";
        classe="excelente";
    }
    else if(pontos>=14){
        resultado="BOM";
        classe="bom";
    }
    else if(pontos>=9){
        resultado="MÉDIO";
        classe="medio";
    }
    else{
        resultado="FRACO";
        classe="fraco";
    }
}



function abrirModal(prefix){
origemAtual = prefix;
document.getElementById("modal").style.display="flex";
}

function salvarTrade(){

let radioSelecionado=document.querySelector(`input[name="gatilhoExec${origemAtual}"]:checked`);

if(!radioSelecionado){
alert("Selecione o gatilho executado.");
return;
}

let alvoValue=document.getElementById("alvo").value;
let parcialValue=document.getElementById("parcial").value;
let gatilhoExecutado=radioSelecionado.value;

let r=0;
if(alvoValue==="1:1R")r=1;
if(alvoValue==="1:2R")r=2;
if(alvoValue==="1:3R")r=3;
if(alvoValue==="Stop")r=-1;

let trade={...ultimoResultado,gatilhoExecutado,alvo:alvoValue,parcial:parcialValue,r};

trades.push(trade);
localStorage.setItem("tradesSMC",JSON.stringify(trades));

document.getElementById("modal").style.display="none";
atualizarEstatisticas();
}

function atualizarEstatisticas(){
let total=trades.length;
let wins=trades.filter(t=>t.r>0).length;
let stops=trades.filter(t=>t.r<0).length;
let rTotal=trades.reduce((acc,t)=>acc+t.r,0);
let winrate= total?((wins/total)*100).toFixed(1):0;
let payoff= total?(rTotal/total).toFixed(2):0;

document.getElementById("estatisticas").innerHTML=
`Total: ${total}<br>
Wins: ${wins}<br>
Stops: ${stops}<br>
Winrate: ${winrate}%<br>
R Total: ${rTotal}<br>
Payoff Médio: ${payoff}R`;
}

function exportarCSV(){
let csv="Data,Hora,Origem,Setup,GatilhoExecutado,Macro,Micro,MM80,VWAP,Estoc,OBPrimario,OBSecundario,Pontos,Resultado,Alvo,Parcial,R\n";
trades.forEach(t=>{
csv+=`${t.data},${t.hora},${t.origem},${t.setup},${t.gatilhoExecutado},${t.macro},${t.micro},${t.mm80},${t.vwap},${t.estoc},${t.obp},${t.obs},${t.pontos},${t.resultado},${t.alvo},${t.parcial},${t.r}\n`;
});
let blob=new Blob([csv],{type:"text/csv"});
let link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download="trades_smc.csv";
link.click();
}

function limparHistorico(){
if(confirm("Deseja apagar todo histórico?")){
trades=[];
localStorage.removeItem("tradesSMC");
atualizarEstatisticas();
}
}

atualizarEstatisticas();

</script>

</body>
</html>
