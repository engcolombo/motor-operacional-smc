<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Motor Operacional SMC</title>

<link href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css" rel="stylesheet"/>

<style>
body {
    background: linear-gradient(135deg, #0f3d91, #1e4ed8);
    min-height: 100vh;
}

.page {
    padding: 40px 20px;
}

.card {
    border-radius: 18px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

.form-select, .btn {
    border-radius: 14px !important;
}

.hidden {
    display:none;
}

.fade {
    animation: fadeIn 0.3s ease-in-out;
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(10px);}
    to {opacity:1; transform:translateY(0);}
}

.dashboard-card {
    border-radius:18px;
    padding:20px;
    color:white;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

.modal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
}

.modal-content {
    background:white;
    padding:25px;
    width:320px;
    border-radius:18px;
}
</style>
</head>

<body>

<div class="page container-xl">

<!-- ===== BOTÕES TOPO ===== -->
<div class="d-flex justify-content-between mb-4">
<h2 class="text-white">Motor Operacional SMC</h2>
<div>
<button class="btn btn-light" onclick="mostrarOperacional()">Operacional</button>
<button class="btn btn-warning" onclick="mostrarDashboard()">Dashboard</button>
</div>
</div>

<!-- ================= TELA OPERACIONAL ================= -->
<div id="paginaOperacional" class="fade">

<div class="row g-4">
<!-- COLE AQUI SEUS 3 CARDS ORIGINAIS (TRAP / SMC / OB) -->
<!-- NÃO ALTERE NADA DOS IDs OU BOTÕES -->
</div>

</div>

<!-- ================= TELA DASHBOARD ================= -->
<div id="paginaDashboard" class="hidden fade">

<div class="row g-4">

<div class="col-md-2">
<div class="dashboard-card bg-blue">
<h6>Total</h6>
<h2 id="statTotal">0</h2>
</div>
</div>

<div class="col-md-2">
<div class="dashboard-card bg-green">
<h6>Wins</h6>
<h2 id="statWins">0</h2>
</div>
</div>

<div class="col-md-2">
<div class="dashboard-card bg-red">
<h6>Stops</h6>
<h2 id="statStops">0</h2>
</div>
</div>

<div class="col-md-2">
<div class="dashboard-card bg-yellow">
<h6>Winrate</h6>
<h2 id="statWinrate">0%</h2>
</div>
</div>

<div class="col-md-2">
<div class="dashboard-card bg-indigo">
<h6>R Total</h6>
<h2 id="statRTotal">0</h2>
</div>
</div>

<div class="col-md-2">
<div class="dashboard-card bg-cyan">
<h6>Payoff Médio</h6>
<h2 id="statPayoff">0R</h2>
</div>
</div>

</div>

<div class="mt-4">
<button class="btn btn-success" onclick="exportarCSV()">Exportar CSV</button>
<button class="btn btn-danger" onclick="limparHistorico()">Limpar Histórico</button>
</div>

</div>

</div>

<!-- Modal -->
<div class="modal" id="modal">
<div class="modal-content">

<label class="form-label">Alvo</label>
<select id="alvo" class="form-select">
<option>1:1R</option>
<option>1:2R</option>
<option>1:3R</option>
<option>Stop</option>
</select>

<label class="form-label mt-3">Parcial?</label>
<select id="parcial" class="form-select">
<option>Sim</option>
<option>Não</option>
</select>

<button class="btn btn-primary w-100 mt-3" onclick="salvarTrade()">Salvar</button>

</div>
</div>

<script>

/* ===== TRANSIÇÃO ENTRE TELAS ===== */

function mostrarDashboard(){
document.getElementById("paginaOperacional").classList.add("hidden");
document.getElementById("paginaDashboard").classList.remove("hidden");
atualizarEstatisticas();
}

function mostrarOperacional(){
document.getElementById("paginaDashboard").classList.add("hidden");
document.getElementById("paginaOperacional").classList.remove("hidden");
}

/* ===== SEU SCRIPT ORIGINAL AQUI COMPLETO (SEM ALTERAÇÃO) ===== */
/* cole aqui exatamente seu JS anterior */

</script>

</body>
</html>
