<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Motor Operacional SMC</title>

<style>
body { font-family: Arial; background:#f4f6f8; padding:30px; }
.wrapper { display:flex; gap:20px; justify-content:center; flex-wrap:wrap; }

.container {
    background:white;
    padding:20px;
    width:360px;
    border-radius:8px;
    box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

label { font-weight:bold; font-size:13px; margin-top:6px; display:block; }
select, button { width:100%; padding:8px; margin-bottom:10px; font-size:14px; }

button { background:#003366; color:white; border:none; cursor:pointer; }
button:hover { background:#002244; }

.resultado {
    margin-top:10px;
    padding:12px;
    border-radius:6px;
    font-weight:bold;
    text-align:center;
}

.excelente { background:#cce5ff; color:#004085; }
.bom { background:#d4edda; color:#155724; }
.medio { background:#fff3cd; color:#856404; }
.fraco { background:#f8d7da; color:#721c24; }

.gatilhos-box {
    background:#f1f1f1;
    padding:10px;
    border-radius:6px;
    margin-top:10px;
    font-size:13px;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- CARD A -->
<div class="container">
<h3>Setup A - Trap D1</h3>

<label>Setup</label>
<select id="setupA">
<option></option>
<option>Trap na Máxima - VENDA</option>
<option>Trap na Mínima - COMPRA</option>
</select>

<label>Macro</label>
<select id="macroA">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<label>Micro</label>
<select id="microA">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<label>MM80</label>
<select id="mm80A">
<option></option><option>Subindo</option><option>Caindo</option>
</select>

<label>VWAP</label>
<select id="vwapA">
<option></option><option>Distante</option><option>Proximo</option><option>Toque</option>
</select>

<label>Estocástico</label>
<select id="estocA">
<option></option><option>Divergente</option><option>Nao divergente</option>
</select>

<button onclick="avaliarA()">Avaliar</button>

<div id="resultadoA" class="resultado"></div>
<div id="gatilhosA" class="gatilhos-box"></div>

</div>

<!-- CARD B -->
<div class="container">
<h3>Setup B - Novo Setup</h3>

<label>Setup</label>
<select id="setupB">
<option></option>
<option>Trap na Máxima - VENDA</option>
<option>Trap na Mínima - COMPRA</option>
</select>

<label>Macro</label>
<select id="macroB">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<label>Micro</label>
<select id="microB">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<label>MM80</label>
<select id="mm80B">
<option></option><option>Subindo</option><option>Caindo</option>
</select>

<label>VWAP</label>
<select id="vwapB">
<option></option><option>Distante</option><option>Proximo</option><option>Toque</option>
</select>

<label>Estocástico</label>
<select id="estocB">
<option></option><option>Divergente</option><option>Nao divergente</option>
</select>

<button onclick="avaliarB()">Avaliar</button>

<div id="resultadoB" class="resultado"></div>
<div id="gatilhosB" class="gatilhos-box"></div>

</div>

</div>

<script>

function calcularLogica(setupValue,macroValue,microValue,mm80Value,vwapValue,estocValue){

let pontos=0;

if(setupValue==="Trap na Máxima - VENDA"){
if(macroValue==="Baixa")pontos+=4;
if(macroValue==="Lateral")pontos+=2;
if(macroValue==="Alta")pontos+=1;
if(microValue==="Lateral")pontos+=2;
if(microValue==="Baixa")pontos+=1;
if(mm80Value==="Caindo")pontos+=3;
if(mm80Value==="Subindo")pontos+=2;
}

if(setupValue==="Trap na Mínima - COMPRA"){
if(macroValue==="Alta")pontos+=4;
if(macroValue==="Lateral")pontos+=2;
if(macroValue==="Baixa")pontos+=1;
if(microValue==="Lateral")pontos+=2;
if(microValue==="Alta")pontos+=1;
if(mm80Value==="Subindo")pontos+=3;
if(mm80Value==="Caindo")pontos+=2;
}

if(vwapValue==="Distante")pontos+=4;
if(vwapValue==="Proximo")pontos+=1;
if(estocValue==="Divergente")pontos+=2;

let resultado="";
let classe="";
let gatilhos=[];

if(pontos>=14){
resultado="EXCELENTE";
classe="excelente";
gatilhos=["Rossadinha","FF-FD","PFR","Inside","CHOCH","POI"];
}
else if(pontos>=12){
resultado="BOM";
classe="bom";
gatilhos=["Rossadinha","Inside","POI","FF-FD"];
}
else if(pontos>=8){
resultado="MÉDIO";
classe="medio";
gatilhos=["Inside","POI"];
}
else{
resultado="FRACO";
classe="fraco";
gatilhos=["POI"];
}

return {resultado,classe,gatilhos,pontos};
}

function avaliarA(){
let r=calcularLogica(
setupA.value,
macroA.value,
microA.value,
mm80A.value,
vwapA.value,
estocA.value
);

resultadoA.className="resultado "+r.classe;
resultadoA.innerHTML=r.resultado+"<br>Pontuação: "+r.pontos;

gatilhosA.innerHTML=r.gatilhos.map(g=>`<div>○ ${g}</div>`).join("");
}

function avaliarB(){
let r=calcularLogica(
setupB.value,
macroB.value,
microB.value,
mm80B.value,
vwapB.value,
estocB.value
);

resultadoB.className="resultado "+r.classe;
resultadoB.innerHTML=r.resultado+"<br>Pontuação: "+r.pontos;

gatilhosB.innerHTML=r.gatilhos.map(g=>`<div>○ ${g}</div>`).join("");
}

</script>

</body>
</html>
