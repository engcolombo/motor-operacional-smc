<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Motor Operacional SMC</title>

<style>
body { font-family: Arial; background:#f4f6f8; padding:30px; }
.wrapper { display:flex; justify-content:center; }
.container { background:white; padding:20px; width:380px; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.05); }

label { font-weight:bold; font-size:13px; margin-top:6px; display:block; }
select, button, textarea { width:100%; padding:8px; margin-bottom:10px; font-size:14px; }

button { background:#003366; color:white; border:none; cursor:pointer; }
button:hover { background:#002244; }

.resultado {
    margin-top:10px;
    padding:15px;
    border-radius:6px;
    font-weight:bold;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.excelente { background:#cce5ff; color:#004085; }
.bom { background:#d4edda; color:#155724; }
.medio { background:#fff3cd; color:#856404; }
.fraco { background:#f8d7da; color:#721c24; }

.gatilhos-box {
    background:#f1f1f1;
    padding:10px;
    border-radius:6px;
    margin-top:10px;
    font-size:13px;
}

.stats {
    margin-top:15px;
    padding:10px;
    background:#e9ecef;
    border-radius:6px;
    font-size:13px;
}

.modal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;
    align-items:center;
}

.modal-content {
    background:white;
    padding:20px;
    width:300px;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="wrapper">
<div class="container">

<label>Setup</label>
<select id="gatilho">
<option value=""></option>
<option>Trap na Máxima - VENDA</option>
<option>Trap na Mínima - COMPRA</option>
</select>

<label>Tendência Macro</label>
<select id="macro">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<label>Tendência Micro</label>
<select id="micro">
<option></option><option>Alta</option><option>Baixa</option><option>Lateral</option>
</select>

<label>MM80</label>
<select id="mm80">
<option></option><option>Subindo</option><option>Caindo</option>
</select>

<label>VWAP</label>
<select id="vwap">
<option></option><option>Distante</option><option>Proximo</option><option>Toque</option>
</select>

<label>Estocástico</label>
<select id="estoc">
<option></option><option>Divergente</option><option>Nao divergente</option>
</select>

<label>OB Primário</label>
<select id="obp">
<option></option><option>Sim</option><option>Nao</option>
</select>

<label>OB Secundário</label>
<select id="obs">
<option></option><option>Sim</option><option>Nao</option>
</select>

<button onclick="avaliar()">Avaliar</button>

<div id="resultado" class="resultado"></div>

<div id="gatilhosPermitidos" class="gatilhos-box"></div>

<button id="btnRegistrar" style="display:none;" onclick="abrirModal()">Registrar Trade</button>
<button onclick="exportarCSV()">Exportar CSV</button>
<button onclick="limparHistorico()">Limpar Histórico</button>

<div class="stats" id="estatisticas"></div>

</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">

<label>Alvo</label>
<select id="alvo">
<option>1:1R</option>
<option>1:2R</option>
<option>1:3R</option>
<option>Stop</option>
</select>

<label>Parcial?</label>
<select id="parcial">
<option>Sim</option>
<option>Não</option>
</select>

<button onclick="salvarTrade()">Salvar</button>

</div>
</div>

<script>

let trades = JSON.parse(localStorage.getItem("tradesSMC")) || [];
let ultimoResultado = {};

function avaliar(){

let setupValue = document.getElementById("gatilho").value;
let macroValue = document.getElementById("macro").value;
let microValue = document.getElementById("micro").value;
let mm80Value = document.getElementById("mm80").value;
let vwapValue = document.getElementById("vwap").value;
let estocValue = document.getElementById("estoc").value;
let obpValue = document.getElementById("obp").value;
let obsValue = document.getElementById("obs").value;

if(setupValue===""){ alert("Selecione o setup."); return; }

let pontos = 0;

/* TRAP VENDA */
if(setupValue==="Trap na Máxima - VENDA"){
if(macroValue==="Baixa")pontos+=4;
if(macroValue==="Lateral")pontos+=2;
if(macroValue==="Alta")pontos+=1;
if(microValue==="Lateral")pontos+=2;
if(microValue==="Baixa")pontos+=1;
if(mm80Value==="Caindo")pontos+=3;
if(mm80Value==="Subindo")pontos+=2;
}

/* TRAP COMPRA */
if(setupValue==="Trap na Mínima - COMPRA"){
if(macroValue==="Alta")pontos+=4;
if(macroValue==="Lateral")pontos+=2;
if(macroValue==="Baixa")pontos+=1;
if(microValue==="Lateral")pontos+=2;
if(microValue==="Alta")pontos+=1;
if(mm80Value==="Subindo")pontos+=3;
if(mm80Value==="Caindo")pontos+=2;
}

/* Fatores gerais */
if(vwapValue==="Distante")pontos+=4;
if(vwapValue==="Proximo")pontos+=1;
if(estocValue==="Divergente")pontos+=2;
if(obpValue==="Sim")pontos+=2;
if(obsValue==="Sim")pontos+=1;

/* Teto estrutural */
if(setupValue==="Trap na Máxima - VENDA" && macroValue==="Alta" && pontos>13)pontos=13;
if(setupValue==="Trap na Mínima - COMPRA" && macroValue==="Baixa" && pontos>13)pontos=13;

/* Classificação + gatilhos */
let resultado="";
let classe="";
let bolinha="●";
let gatilhosPermitidos=[];

if(pontos>=14){
resultado="EXCELENTE";
classe="excelente";
gatilhosPermitidos=["Rossadinha vwap","FF-FD vwap","PFR 10m","Inside bar reversão","CHOCH","POI"];
}
else if(pontos>=12){
resultado="BOM";
classe="bom";
gatilhosPermitidos=["Rossadinha vwap","Inside bar reversão","POI","FF-FD vwap"];
}
else if(pontos>=8){
resultado="MÉDIO";
classe="medio";
gatilhosPermitidos=["Inside bar reversão","POI"];
}
else if(pontos>=4){
resultado="FRACO";
classe="fraco";
gatilhosPermitidos=["POI"];
}
else{
resultado="EVITAR";
classe="fraco";
gatilhosPermitidos=[];
}

let resultadoDiv=document.getElementById("resultado");
resultadoDiv.className="resultado "+classe;
resultadoDiv.innerHTML=`<span>${bolinha}</span> ${resultado}<br>Pontuação: ${pontos}`;

/* Mostrar gatilhos */
let gatilhosDiv=document.getElementById("gatilhosPermitidos");

if(gatilhosPermitidos.length===0){
gatilhosDiv.innerHTML="";
document.getElementById("btnRegistrar").style.display="none";
}else{
let html="<strong>Gatilhos Autorizados:</strong><br>";
gatilhosPermitidos.forEach(g=>{
html+=`<label><input type="radio" name="gatilhoExec" value="${g}"> ${g}</label><br>`;
});
gatilhosDiv.innerHTML=html;
document.getElementById("btnRegistrar").style.display="block";
}

/* Data e hora */
let agora=new Date();
ultimoResultado={
data:agora.toLocaleDateString(),
hora:agora.toLocaleTimeString(),
setup:setupValue,
macro:macroValue,
micro:microValue,
mm80:mm80Value,
vwap:vwapValue,
estoc:estocValue,
obp:obpValue,
obs:obsValue,
pontos,
resultado
};

}

function abrirModal(){
document.getElementById("modal").style.display="flex";
}

function salvarTrade(){

let radioSelecionado=document.querySelector('input[name="gatilhoExec"]:checked');
if(!radioSelecionado){
alert("Selecione o gatilho executado.");
return;
}

let alvoValue=document.getElementById("alvo").value;
let parcialValue=document.getElementById("parcial").value;
let gatilhoExecutado=radioSelecionado.value;

let r=0;
if(alvoValue==="1:1R")r=1;
if(alvoValue==="1:2R")r=2;
if(alvoValue==="1:3R")r=3;
if(alvoValue==="Stop")r=-1;

let trade={...ultimoResultado,gatilhoExecutado,alvo:alvoValue,parcial:parcialValue,r};

trades.push(trade);
localStorage.setItem("tradesSMC",JSON.stringify(trades));

document.getElementById("modal").style.display="none";
atualizarEstatisticas();
alert("Trade registrado!");
}

function atualizarEstatisticas(){
let total=trades.length;
let wins=trades.filter(t=>t.r>0).length;
let stops=trades.filter(t=>t.r<0).length;
let rTotal=trades.reduce((acc,t)=>acc+t.r,0);
let winrate= total?((wins/total)*100).toFixed(1):0;
let payoff= total?(rTotal/total).toFixed(2):0;

document.getElementById("estatisticas").innerHTML=
`Total: ${total}<br>
Wins: ${wins}<br>
Stops: ${stops}<br>
Winrate: ${winrate}%<br>
R Total: ${rTotal}<br>
Payoff Médio: ${payoff}R`;
}

function exportarCSV(){
let csv="Data,Hora,Setup,GatilhoExecutado,Macro,Micro,MM80,VWAP,Estoc,OBPrimario,OBSecundario,Pontos,Resultado,Alvo,Parcial,R\n";
trades.forEach(t=>{
csv+=`${t.data},${t.hora},${t.setup},${t.gatilhoExecutado},${t.macro},${t.micro},${t.mm80},${t.vwap},${t.estoc},${t.obp},${t.obs},${t.pontos},${t.resultado},${t.alvo},${t.parcial},${t.r}\n`;
});
let blob=new Blob([csv],{type:"text/csv"});
let link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download="trades_smc.csv";
link.click();
}

function limparHistorico(){
if(confirm("Deseja apagar todo histórico?")){
trades=[];
localStorage.removeItem("tradesSMC");
atualizarEstatisticas();
}
}

atualizarEstatisticas();

</script>

</body>
</html>
